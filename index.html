<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#212121">
<meta name="description" content="AMORA AI - Personal AI Assistant">
<title>AMORA AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#212121;
  --sidebar:#171717;
  --surface:#2f2f2f;
  --surface2:#3a3a3a;
  --border:#444;
  --text:#ececec;
  --muted:#a0a0a0;
  --accent:#10a37f;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* =========================
   APP
========================= */

.app{
  width:100%;
  height:100dvh;
  display:flex;
  overflow:hidden;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
  width:280px;
  height:100%;
  background:var(--sidebar);
  display:flex;
  flex-direction:column;
  flex-shrink:0;
  border-right:1px solid #303030;
  transition:transform .2s ease;
  z-index:100;
}

.sidebar-top{
  padding:12px;
}

.new-chat{
  width:100%;
  min-height:46px;
  border:1px solid #444;
  border-radius:10px;
  background:transparent;
  color:white;
  text-align:left;
  padding:0 14px;
  font-size:14px;
}

.new-chat:hover{
  background:#252525;
}

.history-title{
  color:#777;
  font-size:11px;
  text-transform:uppercase;
  padding:15px 15px 7px;
}

.history{
  flex:1;
  overflow-y:auto;
  padding:0 8px;
}

.history-item{
  padding:11px 10px;
  border-radius:8px;
  color:#d0d0d0;
  font-size:13px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  cursor:pointer;
}

.history-item:hover{
  background:#252525;
}

.sidebar-bottom{
  border-top:1px solid #303030;
  padding:8px;
}

.sidebar-button{
  width:100%;
  border:0;
  background:transparent;
  color:#ddd;
  text-align:left;
  padding:11px 10px;
  border-radius:8px;
  font-size:13px;
}

.sidebar-button:hover{
  background:#252525;
}

/* =========================
   MAIN
========================= */

.main{
  flex:1;
  min-width:0;
  height:100%;
  display:flex;
  flex-direction:column;
  position:relative;
}

/* =========================
   HEADER
========================= */

.header{
  height:58px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  border-bottom:1px solid rgba(255,255,255,.06);
  background:rgba(33,33,33,.96);
  z-index:20;
}

.header-left{
  display:flex;
  align-items:center;
  gap:10px;
}

.menu-button{
  display:none;
  border:0;
  background:transparent;
  color:white;
  font-size:22px;
  padding:5px;
}

.brand{
  font-weight:600;
  font-size:16px;
}

.brand-sub{
  color:#888;
  font-size:10px;
  margin-top:2px;
}

.header-button{
  border:0;
  background:transparent;
  color:#bbb;
  font-size:19px;
  padding:7px;
}

/* =========================
   CHAT
========================= */

.chat{
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  padding-bottom:20px;
  scroll-behavior:smooth;
}

.chat-inner{
  width:100%;
  max-width:850px;
  margin:0 auto;
  padding:30px 20px 120px;
}

/* =========================
   WELCOME
========================= */

.welcome{
  min-height:55vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:30px 10px;
}

.amora-logo{
  width:64px;
  height:64px;
  border-radius:18px;
  background:linear-gradient(135deg,#10a37f,#087f63);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  font-weight:800;
  margin-bottom:20px;
}

.welcome h1{
  font-size:28px;
  font-weight:600;
  margin-bottom:9px;
}

.welcome p{
  color:#999;
  font-size:14px;
  line-height:1.5;
}

/* =========================
   SUGGESTIONS
========================= */

.suggestions{
  width:100%;
  max-width:650px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:28px;
}

.suggestion{
  border:1px solid #444;
  background:#2a2a2a;
  color:#ddd;
  border-radius:12px;
  padding:14px;
  text-align:left;
  min-height:64px;
}

.suggestion:hover{
  background:#343434;
}

.suggestion-title{
  display:block;
  font-size:13px;
  font-weight:600;
  margin-bottom:4px;
}

.suggestion-description{
  color:#888;
  font-size:11px;
}

/* =========================
   MESSAGE
========================= */

.message{
  display:flex;
  gap:12px;
  width:100%;
  padding:20px 0;
}

.message.user{
  justify-content:flex-end;
}

.message-avatar{
  width:30px;
  height:30px;
  border-radius:8px;
  background:#10a37f;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:700;
  flex-shrink:0;
}

.message-content{
  max-width:calc(100% - 45px);
}

.message.user .message-content{
  max-width:80%;
}

.bubble{
  font-size:15px;
  line-height:1.65;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.message.user .bubble{
  background:#2f2f2f;
  border-radius:18px;
  padding:11px 15px;
}

.message.ai .bubble{
  padding:0;
}

.message-actions{
  display:flex;
  gap:5px;
  margin-top:9px;
}

.message-action{
  border:0;
  background:transparent;
  color:#888;
  font-size:11px;
  padding:4px 6px;
  border-radius:6px;
}

.message-action:hover{
  background:#333;
  color:#ddd;
}

/* =========================
   TYPING
========================= */

.typing{
  display:flex;
  align-items:center;
  gap:7px;
  color:#888;
  font-size:13px;
  padding:10px 0;
}

.typing-dots{
  display:flex;
  gap:3px;
}

.typing-dots span{
  width:5px;
  height:5px;
  background:#888;
  border-radius:50%;
  animation:typing 1.2s infinite;
}

.typing-dots span:nth-child(2){
  animation-delay:.15s;
}

.typing-dots span:nth-child(3){
  animation-delay:.3s;
}

@keyframes typing{
  0%,60%,100%{
    opacity:.25;
    transform:translateY(0);
  }
  30%{
    opacity:1;
    transform:translateY(-2px);
  }
}

/* =========================
   COMPOSER
========================= */

.composer-area{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:10px 16px 15px;
  background:linear-gradient(
    to top,
    #212121 65%,
    rgba(33,33,33,0)
  );
  z-index:15;
}

.composer{
  width:100%;
  max-width:850px;
  margin:auto;
  background:#2f2f2f;
  border:1px solid #4a4a4a;
  border-radius:18px;
  display:flex;
  align-items:flex-end;
  padding:8px;
  box-shadow:0 4px 20px rgba(0,0,0,.25);
}

.composer:focus-within{
  border-color:#666;
}

.composer-button{
  width:38px;
  height:38px;
  flex-shrink:0;
  border:0;
  border-radius:10px;
  background:transparent;
  color:#aaa;
  font-size:18px;
}

.composer-button:hover{
  background:#414141;
  color:white;
}

textarea{
  flex:1;
  min-width:0;
  min-height:38px;
  max-height:150px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  padding:9px 8px;
  font-size:15px;
  line-height:1.4;
}

textarea::placeholder{
  color:#888;
}

.send-button{
  width:38px;
  height:38px;
  flex-shrink:0;
  border:0;
  border-radius:10px;
  background:#10a37f;
  color:white;
  font-size:17px;
}

.send-button:disabled{
  background:#555;
  cursor:not-allowed;
}

.composer-hint{
  max-width:850px;
  margin:6px auto 0;
  text-align:center;
  color:#666;
  font-size:10px;
}

/* =========================
   MODAL
========================= */

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:200;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.modal{
  width:min(430px,100%);
  background:#202020;
  border:1px solid #444;
  border-radius:16px;
  padding:20px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.modal h2{
  font-size:19px;
  margin-bottom:6px;
}

.modal-description{
  color:#999;
  font-size:12px;
  margin-bottom:18px;
}

.personality-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.personality{
  border:1px solid #444;
  background:#292929;
  color:#ddd;
  padding:12px;
  border-radius:10px;
  text-align:left;
}

.personality.active{
  border-color:#10a37f;
  background:#123b32;
}

.personality small{
  display:block;
  color:#888;
  margin-top:4px;
}

.modal-close{
  width:100%;
  border:0;
  background:#333;
  color:white;
  padding:11px;
  border-radius:9px;
  margin-top:15px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  .sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    transform:translateX(-100%);
    box-shadow:15px 0 40px rgba(0,0,0,.45);
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .menu-button{
    display:block;
  }

  .header{
    height:55px;
    padding:0 10px;
  }

  .brand{
    font-size:15px;
  }

  .chat-inner{
    padding:15px 14px 110px;
  }

  .welcome{
    min-height:58vh;
    padding-top:15px;
  }

  .welcome h1{
    font-size:24px;
  }

  .welcome p{
    font-size:13px;
  }

  .amora-logo{
    width:58px;
    height:58px;
    font-size:25px;
  }

  .suggestions{
    grid-template-columns:1fr;
    gap:8px;
    margin-top:22px;
  }

  .suggestion{
    min-height:58px;
  }

  .message{
    padding:15px 0;
  }

  .message-content{
    max-width:calc(100% - 40px);
  }

  .message.user .message-content{
    max-width:88%;
  }

  .bubble{
    font-size:14px;
  }

  .composer-area{
    padding:7px 8px calc(8px + env(safe-area-inset-bottom));
  }

  .composer{
    border-radius:17px;
  }

  .composer-hint{
    display:none;
  }

  .personality-grid{
    grid-template-columns:1fr;
  }
}

@media(min-width:701px){
  .sidebar-overlay{
    display:none!important;
  }
}

/* =========================
   SIDEBAR OVERLAY MOBILE
========================= */

.sidebar-overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:90;
}

.sidebar-overlay.show{
  display:block;
}
</style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->

  <aside class="sidebar" id="sidebar">

    <div class="sidebar-top">

      <button class="new-chat" onclick="newChat()">
        ＋ &nbsp;New chat
      </button>

    </div>

    <div class="history-title">
      Recent chats
    </div>

    <div class="history" id="history"></div>

    <div class="sidebar-bottom">

      <button class="sidebar-button" onclick="openPersonality()">
        🎭 &nbsp;AI Personality
      </button>

      <button class="sidebar-button" onclick="openSettings()">
        ⚙️ &nbsp;Settings
      </button>

    </div>

  </aside>

  <div
    class="sidebar-overlay"
    id="sidebarOverlay"
    onclick="closeSidebar()">
  </div>

  <!-- MAIN -->

  <main class="main">

    <header class="header">

      <div class="header-left">

        <button
          class="menu-button"
          onclick="toggleSidebar()">
          ☰
        </button>

        <div>
          <div class="brand">
            AMORA AI
          </div>

          <div class="brand-sub" id="personalityText">
            Personal AI assistant
          </div>
        </div>

      </div>

      <button
        class="header-button"
        onclick="newChat()"
        title="New chat">
        ＋
      </button>

    </header>

    <!-- CHAT -->

    <section class="chat" id="chat">

      <div class="chat-inner" id="chatInner">

        <div class="welcome" id="welcome">

          <div class="amora-logo">
            A
          </div>

          <h1>
            How can I help you?
          </h1>

          <p>
            I'm AMORA, your personal AI assistant.
          </p>

          <div class="suggestions">

            <button
              class="suggestion"
              onclick="useSuggestion('Explain something to me simply')">

              <span class="suggestion-title">
                💡 Explain something
              </span>

              <span class="suggestion-description">
                Make a difficult topic simple
              </span>

            </button>

            <button
              class="suggestion"
              onclick="useSuggestion('Help me write some code')">

              <span class="suggestion-title">
                💻 Write code
              </span>

              <span class="suggestion-description">
                Build or debug a project
              </span>

            </button>

            <button
              class="suggestion"
              onclick="useSuggestion('Give me some creative ideas')">

              <span class="suggestion-title">
                ✨ Creative ideas
              </span>

              <span class="suggestion-description">
                Generate ideas and concepts
              </span>

            </button>

            <button
              class="suggestion"
              onclick="useSuggestion('Help me make a plan')">

              <span class="suggestion-title">
                📋 Make a plan
              </span>

              <span class="suggestion-description">
                Turn your goal into steps
              </span>

            </button>

          </div>

        </div>

      </div>

    </section>

    <!-- COMPOSER -->

    <div class="composer-area">

      <div class="composer">

        <button
          class="composer-button"
          onclick="showComingSoon('Attachments')"
          title="Attachments">
          ＋
        </button>

        <textarea
          id="messageInput"
          rows="1"
          placeholder="Message AMORA..."
          oninput="autoResize(this)"
          onkeydown="handleKey(event)">
        </textarea>

        <button
          class="composer-button"
          onclick="startVoice()"
          title="Voice input">
          🎤
        </button>

        <button
          class="send-button"
          id="sendButton"
          onclick="sendMessage()"
          title="Send">
          ↑
        </button>

      </div>

      <div class="composer-hint">
        AMORA can make mistakes. Check important information.
      </div>

    </div>

  </main>

</div>


<!-- PERSONALITY MODAL -->

<div
  class="overlay"
  id="personalityModal">

  <div class="modal">

    <h2>
      🎭 AI Personality
    </h2>

    <p class="modal-description">
      Choose how you want AMORA to talk with you.
    </p>

    <div class="personality-grid">

      <button
        class="personality"
        id="personality-normal"
        onclick="setPersonality('normal')">

        <b>Normal</b>
        <small>Clear and natural</small>

      </button>

      <button
        class="personality"
        id="personality-friend"
        onclick="setPersonality('friend')">

        <b>Friend / Yaar</b>
        <small>Casual and friendly</small>

      </button>

      <button
        class="personality"
        id="personality-filmy"
        onclick="setPersonality('filmy')">

        <b>Filmy 🎬</b>
        <small>Expressive and dramatic</small>

      </button>

      <button
        class="personality"
        id="personality-slang"
        onclick="setPersonality('slang')">

        <b>Slang 😎</b>
        <small>Very casual language</small>

      </button>

    </div>

    <button
      class="modal-close"
      onclick="closeModals()">
      Done
    </button>

  </div>

</div>


<!-- SETTINGS MODAL -->

<div
  class="overlay"
  id="settingsModal">

  <div class="modal">

    <h2>
      ⚙️ Settings
    </h2>

    <p class="modal-description">
      AMORA settings.
    </p>

    <button
      class="sidebar-button"
      onclick="clearHistory()">

      🗑️ Clear chat history

    </button>

    <button
      class="sidebar-button"
      onclick="showComingSoon('More settings')">

      🔧 More settings

    </button>

    <button
      class="modal-close"
      onclick="closeModals()">

      Close

    </button>

  </div>

</div>


<script>

/* =========================
   STATE
========================= */

const chat = document.getElementById("chat");
const chatInner = document.getElementById("chatInner");
const input = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");
const historyBox = document.getElementById("history");

let conversation = [];
let currentChat = [];

let personality =
  localStorage.getItem("amora_personality") ||
  "normal";

let isGenerating = false;
let controller = null;


/* =========================
   UI
========================= */

function scrollBottom(){

  chat.scrollTop = chat.scrollHeight;

}


function autoResize(element){

  element.style.height = "auto";

  element.style.height =
    Math.min(element.scrollHeight,150) + "px";

}


function useSuggestion(text){

  input.value = text;

  autoResize(input);

  input.focus();

}


function handleKey(event){

  if(
    event.key === "Enter" &&
    !event.shiftKey
  ){

    event.preventDefault();

    sendMessage();

  }

}


/* =========================
   SIDEBAR
========================= */

function toggleSidebar(){

  document
    .getElementById("sidebar")
    .classList.add("open");

  document
    .getElementById("sidebarOverlay")
    .classList.add("show");

}


function closeSidebar(){

  document
    .getElementById("sidebar")
    .classList.remove("open");

  document
    .getElementById("sidebarOverlay")
    .classList.remove("show");

}


/* =========================
   MESSAGE
========================= */

function addMessage(
  text,
  type,
  actions = true
){

  const message =
    document.createElement("div");

  message.className =
    "message " + type;

  if(type === "ai"){

    const avatar =
      document.createElement("div");

    avatar.className =
      "message-avatar";

    avatar.textContent = "A";

    message.appendChild(avatar);

  }

  const content =
    document.createElement("div");

  content.className =
    "message-content";

  const bubble =
    document.createElement("div");

  bubble.className = "bubble";

  bubble.textContent = text;

  content.appendChild(bubble);


  if(type === "ai" && actions){

    const actionBar =
      document.createElement("div");

    actionBar.className =
      "message-actions";


    const copyButton =
      document.createElement("button");

    copyButton.className =
      "message-action";

    copyButton.textContent =
      "Copy";

    copyButton.onclick =
      function(){

        if(navigator.clipboard){

          navigator.clipboard.writeText(text);

        }

      };


    actionBar.appendChild(copyButton);

    content.appendChild(actionBar);

  }


  message.appendChild(content);

  chatInner.appendChild(message);

  scrollBottom();

  return message;

}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage(){

  if(isGenerating){

    return;

  }

  const text =
    input.value.trim();

  if(!text){

    return;

  }


  const welcome =
    document.getElementById("welcome");

  if(welcome){

    welcome.remove();

  }


  addMessage(
    text,
    "user",
    false
  );


  currentChat.push({
    role:"user",
    text:text
  });


  input.value = "";

  autoResize(input);


  const typing =
    document.createElement("div");

  typing.className =
    "typing";

  typing.innerHTML = `
    <span>AMORA is thinking</span>
    <span class="typing-dots">
      <span></span>
      <span></span>
      <span></span>
    </span>
  `;

  chatInner.appendChild(typing);

  scrollBottom();


  isGenerating = true;

  sendButton.disabled = true;

  controller =
    new AbortController();


  try{

    const response =
      await fetch(
        "/api/chat",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            message:text,

            history:conversation,

            personality:personality

          }),

          signal:controller.signal

        }
      );


    const data =
      await response.json
